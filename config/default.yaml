schema_version: 5

storage:
  memory_root: data/memory
  database_filename: memory.sqlite

models:
  sam3_checkpoint: weights/sam3/sam3.pt
  qwen_model_id: Qwen/Qwen3-VL-8B-Instruct-FP8
  dinov3_model_id: facebook/dinov3-vitb16-pretrain-lvd1689m
  dinov3_model_path: weights/dinov3/dinov3-vitb16-pretrain-lvd1689m
  dinov3_revision: 5931719e67bbdb9737e363e781fb0c67687896bc

sam3_pipeline:
  points_per_side: 16
  points_per_batch: 32
  confidence_threshold: 0.88
  min_mask_area_ratio: 0.0005
  max_mask_area_ratio: 0.5
  duplicate_mask_iou_threshold: 0.9
  contained_mask_overlap_threshold: 0.9
  max_candidates_per_image: 24
  crop_padding_pixels: 8
  crop_background_color: [127, 127, 127]
  overlay_alpha: 0.0
  overlay_color: [255, 64, 64]

mllm_pipeline:
  prompt_version: object-memory-cluster-review-v1
  max_clusters_per_batch: 8
  max_pixels: 1048576
  max_new_tokens: 4096

visual_fingerprint:
  input_size: 512
  storage_dtype: float16
  similarity_metric: cosine
  global_feature: cls_token
  local_feature: patch_tokens
  min_patch_mask_coverage: 0.5
  local_patch_similarity_threshold: 0.7
  global_weight: 0.5
  local_weight: 0.5
  match_threshold: 0.75
  ambiguity_margin: 0.05
  local_top_k: 3
  cluster_global_similarity_threshold: 0.75
  max_cluster_representatives: 4
  contact_sheet_cell_size: 320
