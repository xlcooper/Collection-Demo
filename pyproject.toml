[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-object-memory"
version = "0.22.1"
description = "Phase-one explicit object-memory demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
object-memory = "object_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
